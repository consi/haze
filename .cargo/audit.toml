# cargo-audit ignore list. This can include lockfile-only crates that the
# feature-aware `cargo deny` graph correctly excludes.
#
# cargo-audit walks the lockfile without feature resolution, so it will
# always report transitive crates that are present in Cargo.lock even when
# our feature flags exclude them from the actual build. cargo-deny does
# feature-aware resolution and is the source of truth for what's really
# linked into the binary. Keep these two in sync.

[advisories]
ignore = [
    # paste, unmaintained. See deny.toml for full rationale.
    "RUSTSEC-2024-0436",
    # rsa Marvin Attack, no fix available. Pulled into Cargo.lock through
    # sqlx-macros' MySQL support; Haze enables SQLite only, and cargo-deny's
    # feature-aware graph confirms the vulnerable crate is not linked.
    "RUSTSEC-2023-0071",
]
