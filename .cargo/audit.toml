# cargo-audit ignore list. Mirrors the ignores in `deny.toml`.
#
# cargo-audit walks the lockfile without feature resolution, so it will
# always report transitive crates that are present in Cargo.lock even when
# our feature flags exclude them from the actual build. cargo-deny does
# feature-aware resolution and is the source of truth for what's really
# linked into the binary. Keep these two in sync.

[advisories]
ignore = [
    # paste, unmaintained. See deny.toml for full rationale.
    "RUSTSEC-2024-0436",
    # rsa Marvin Attack, no fix available. Pulled in via sqlx-mysql, which
    # is dragged into the dep graph by sqlx-macros for compile-time SQL
    # checking. Haze only enables sqlx's "sqlite" feature; the rsa
    # codepath is never linked into the running binary. cargo-deny (which
    # is feature-aware) does not flag this. See deny.toml for the full
    # rationale.
    "RUSTSEC-2023-0071",
]
