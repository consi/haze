name: Main smoke build

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke-backend:
    name: Backend builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master at cutoff
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Bootstrap frontend stub for rust-embed
        run: |
          mkdir -p frontend/build
          echo '<!doctype html><html><body>main smoke stub</body></html>' > frontend/build/index.html
      - run: cargo build --workspace --release --locked

  smoke-frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
