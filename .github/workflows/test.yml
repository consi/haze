name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Bootstrap frontend stub for rust-embed
        # rust-embed resolves frontend/build at compile time; a placeholder is
        # enough for tests because none of the tests touch the embedded assets.
        run: |
          mkdir -p frontend/build
          echo '<!doctype html><html><body>CI stub</body></html>' > frontend/build/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run check
      - run: cd frontend && npm run build

  audit:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources licenses
      - name: cargo-audit
        run: |
          cargo install --locked cargo-audit
          # Ignored advisories (see deny.toml for full rationale):
          #   RUSTSEC-2026-0119  hickory-proto DNS encode O(n²) — we only
          #                      encode single-question stub queries, no
          #                      attacker input on the wire.
          #   RUSTSEC-2024-0436  paste unmaintained — proc-macro, build
          #                      time only, pulled by utoipa-axum.
          #   RUSTSEC-2023-0071  rsa Marvin timing sidechannel — pulled by
          #                      sqlx for MySQL auth only; haze is SQLite.
          cargo audit \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071
