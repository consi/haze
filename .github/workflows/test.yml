name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master at cutoff
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Bootstrap frontend stub for rust-embed
        # rust-embed resolves frontend/build at compile time; a placeholder is
        # enough for tests because none of the tests touch the embedded assets.
        run: |
          mkdir -p frontend/build
          echo '<!doctype html><html><body>CI stub</body></html>' > frontend/build/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm audit --audit-level=moderate
      - run: cd frontend && npm run check
      - run: cd frontend && npm run build

  audit:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master at cutoff
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories sources licenses
      - name: cargo-audit
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          # Ignored advisories (documented here and in audit policy):
          #   RUSTSEC-2024-0436  paste unmaintained — proc-macro, build
          #                      time only, pulled by utoipa-axum.
          cargo audit --ignore RUSTSEC-2024-0436

  dependency-age:
    name: Dependency publication age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -p 'test_dependency_age.py'
      - run: python3 scripts/check_dependency_age.py
      - run: python3 scripts/check_tooling.py
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master at cutoff
        with:
          toolchain: 1.98.0
      - run: cargo install --locked git-cliff --version 2.13.1 --no-default-features
      - run: python3 scripts/test_changelog.py
