[workspace]
resolver = "3"
members = [
    "crates/haze-cli",
    "crates/haze-server",
    "crates/haze-store",
    "crates/haze-probe",
    "crates/haze-api",
    "crates/haze-auth",
    "crates/haze-alert",
]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/consi/haze"

# Workspace-wide lint config. Each crate inherits with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"
unused = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "allow"  # noisy for struct-heavy code

[workspace.lints.clippy]
# Baseline + pedantic + nursery. Curated allow list below for the consistently
# noisy ones; everything else is a warning. CI runs `clippy -- -D warnings`.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic noise.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"

# Float/integer casts are pervasive in latency math and storage encoding.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"

# We rely on infallible `try_into()` for byte-slice conversions in the file
# format; unwrap is fine there. CI can tighten this.
unwrap_used = "allow"
expect_used = "allow"
indexing_slicing = "allow"

# Nursery items that misfire on async-trait and on tower/tokio patterns.
future_not_send = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"

# The axum route modules consistently use `pub(crate) fn` so the router can
# re-export handlers without leaking them as a public API. Lint fires on
# every handler in every routes module - not worth fighting.
redundant_pub_crate = "allow"

# Exact f32/f64 comparisons are fine in test assertions where the inputs are
# deterministic, and in storage code where NaN-handling is explicit.
float_cmp = "allow"

# mul_add is fp-accuracy-first; readability beats it for our percentile/EWMA
# computations and the precision gain is below f32 noise.
suboptimal_flops = "allow"

[workspace.dependencies]
# Async + runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# HTTP + API
axum = { version = "0.8", features = ["macros", "json", "tokio", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br", "set-header"] }
http = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# OpenAPI / Swagger
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid", "chrono", "json"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / logs
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Crypto / auth
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

# TLS - `ring` enabled so rustls has a crypto provider compiled in.
# `CryptoProvider::install_default()` is still required at startup, but the
# feature flag makes the symbols available.
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"

# Probes
surge-ping = "0.8"
hickory-resolver = "0.26"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Storage
memmap2 = "0.9"
parking_lot = "0.12"
fs2 = "0.4"

# Frontend embedding (no `compression` feature - it conflicts with
# utoipa-swagger-ui's internal use of rust-embed. We pre-compress assets in the
# Vite build to .gz/.br siblings and serve them based on Accept-Encoding.)
rust-embed = "8"
mime_guess = "2"

# Utility
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
dashmap = "6"
bytes = "1"
zstd = "0.13"
governor = "0.7"
arc-swap = "1"


# Dev-only
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.release-dev]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
