[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = [
    # paste is archived/unmaintained. Pulled in transitively by utoipa-axum
    # 0.2; there is no fix available and no in-tree replacement. The crate
    # is a procedural macro for token pasting, used at build time only,
    # zero runtime exposure. Revisit when utoipa-axum drops the dep.
    "RUSTSEC-2024-0436",
    # rsa "Marvin Attack" timing sidechannel. Upstream advisory says "no
    # fixed upgrade available". The crate is pulled in transitively by
    # sqlx-mysql, which ships in sqlx-macros for compile-time SQL checking
    # against any configured backend. Haze only enables sqlx's "sqlite"
    # feature at runtime, so the rsa codepath is never linked into the
    # running binary nor executed by the macro. Revisit when sqlx ships a
    # fix or splits macros per backend.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots ≥0.26 relicensed from MPL-2.0 to CDLA-Permissive-2.0
    # (Community Data License Agreement). It's a permissive, OSI-non-listed
    # but FSF-style-free license that explicitly allows redistribution and
    # derivative works; compatible with our AGPL-3.0 binary.
    "CDLA-Permissive-2.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
